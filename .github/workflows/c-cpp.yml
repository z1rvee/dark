name: Build Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Theos and Ldid
      run: |
        export THEOS=$HOME/theos
        if [ ! -d "$THEOS" ]; then
          git clone --recursive https://github.com/theos/theos.git $THEOS
        fi
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        
        curl -L -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64
        sudo chmod +x /usr/local/bin/ldid
        ldid -v || true

    - name: Download iOS SDK
      run: |
        if [ ! -d "$THEOS/sdks" ]; then
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
        fi

    - name: Compile Dylib
      run: |
        make clean || true
        make

    - name: Copy Dylib to Root
      run: |
        # .dylib faylını hər yerdən axtarıb, əsas qovluğa çıxarırıq
        find . -name "*.dylib" -exec cp {} ./ADMIN.dylib \;
        ls -la ADMIN.dylib

    - name: Upload Dylib (Direct)
      uses: actions/upload-artifact@v4
      with:
        name: ADMIN.dylib
        path: ADMIN.dylib
        if-no-files-found: error

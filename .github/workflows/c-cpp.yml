name: Build and Release Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Theos and Ldid
      run: |
        export THEOS=$HOME/theos
        if [ ! -d "$THEOS" ]; then
          git clone --recursive https://github.com/theos/theos.git $THEOS
        fi
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        
        curl -L -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64
        sudo chmod +x /usr/local/bin/ldid
        ldid -v || true

    - name: Download iOS SDK
      run: |
        if [ ! -d "$THEOS/sdks" ]; then
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
        fi

    - name: Compile Dylib
      run: |
        make clean || true
        make

    - name: Find Dylib
      run: |
        find . -name "ADMIN.dylib" -exec cp {} ./ADMIN.dylib \;
        ls -la ADMIN.dylib

    - name: Create Release and Upload Dylib
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: Latest Build
        files: ADMIN.dylib
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

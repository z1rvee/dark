name: Build iOS Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Theos and Tools
      run: |
        export THEOS=$HOME/theos
        if [ ! -d "$THEOS" ]; then
          git clone --recursive https://github.com/theos/theos.git $THEOS
        fi
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        
        # Ldid-i birbaşa GitHub-dan yükləyirik (ən etibarlı üsul)
        wget -q https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64 -O /usr/local/bin/ldid
        chmod +x /usr/local/bin/ldid

    - name: Download iOS SDK
      run: |
        if [ ! -d "$THEOS/sdks" ]; then
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
        fi

    - name: Compile Dylib Only
      run: |
        make clean || true
        make

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ADMIN-Dylib
        path: .theos/obj/arm64/ADMIN.dylib
